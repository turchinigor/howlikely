[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "howlikely"
version = "0.1.0"
description = "Explore annual mortality risk by country, age, sex, and cause of death."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    "polars>=1.12",
    "pyarrow>=18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
howlikely-etl = "howlikely_etl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/howlikely", "pipelines/src/howlikely_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "pipelines/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend/src", "pipelines/src"]
packages = ["howlikely", "howlikely_etl"]
