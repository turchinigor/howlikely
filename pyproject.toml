[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "howlikely"
version = "0.1.0"
description = "Road safety analysis: who dies on the world's roads, and why."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.12",
    "fastexcel>=0.12",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipykernel>=7.0",
    "nbformat>=5.11.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/howlikely"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
